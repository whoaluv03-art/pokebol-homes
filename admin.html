<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153a32">
  <meta name="robots" content="noindex, nofollow">
  <title>Заявки — Покебол</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <path d="M5 37V22a17 17 0 0 1 34 0v15h-7V22a10 10 0 0 0-20 0v15z" fill="#d69c5a" stroke="currentColor" stroke-width="2.5"/>
          <path d="M8 37h28M17 27h10v10H17z" fill="#f3efe4" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <span>покебол<span class="brand-dot">.</span></span>
      </a>
      <div class="admin-header-actions">
        <a class="text-link" href="/">Открыть сайт <span aria-hidden="true">↗</span></a>
        <form method="post" action="/admin/logout">
          <button class="admin-logout" type="submit">Выйти</button>
        </form>
      </div>
    </div>
  </header>
  <main class="container admin-main">
    <p class="eyebrow"><span class="eyebrow-line"></span> Кабинет компании</p>
    <div class="admin-title-row">
      <div><h1>Заявки</h1><p>Новые обращения с сайта — сначала самые свежие.</p></div>
      <button class="admin-refresh" id="refresh-leads" type="button">Обновить</button>
    </div>
    <p class="admin-status" id="admin-status" role="status" aria-live="polite">Загружаем заявки…</p>
    <div class="lead-list" id="lead-list"></div>
  </main>
  <footer class="site-footer">
    <div class="container footer-bottom"><span>© Покебол</span><a href="/">На главную</a></div>
  </footer>
</body>
</html>
