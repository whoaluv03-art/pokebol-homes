<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153a32">
  <title>Вход в кабинет — Покебол</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <path d="M5 37V22a17 17 0 0 1 34 0v15h-7V22a10 10 0 0 0-20 0v15z" fill="#d69c5a" stroke="currentColor" stroke-width="2.5"/>
          <path d="M8 37h28M17 27h10v10H17z" fill="#f3efe4" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <span>покебол<span class="brand-dot">.</span></span>
      </a>
      <a class="text-link" href="/">На сайт <span aria-hidden="true">→</span></a>
    </div>
  </header>
  <main class="admin-auth">
    <form class="admin-auth-card" method="post" action="/admin/login">
      <p class="eyebrow"><span class="eyebrow-line"></span> Закрытый раздел</p>
      <h1>Вход в кабинет</h1>
      <p class="admin-auth-description">Управление заявками компании «Покебол».</p>
      <!-- LOGIN_ERROR -->
      <input type="hidden" name="csrfToken" value="__CSRF_TOKEN__">
      <label for="admin-login">Логин</label>
      <input id="admin-login" name="login" type="text" autocomplete="username" required>
      <label for="admin-password">Пароль</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-coral" type="submit">Войти <span aria-hidden="true">↗</span></button>
    </form>
  </main>
  <footer class="site-footer">
    <div class="container footer-bottom"><span>© Покебол</span><a href="/">На главную</a></div>
  </footer>
</body>
</html>
